schema-version = 1
upstream-base = 'v0.21.3-Beta'

[[patch]]
id = 'container-local-focus'
commit-subject = 'Add container-local focus cycling'
status = 'submitted'
upstream-reference = 'https://github.com/nikitabobko/AeroSpace/pull/2048'
tests = ['FocusCommandTest']
regressions = ['ASR-0001']
retire-when = 'Upstream provides equivalent container-next/container-prev cycling with ancestor fallback and all retained tests pass.'

[[patch]]
id = 'custom-app-bundle'
commit-subject = 'Add side-by-side AeroSpace Custom build'
status = 'custom-only'
upstream-reference = ''
tests = ['AppMetadataTest']
feature-class = 'product-identity'
feature-rationale = 'Provides a separately named app bundle and Accessibility identity that can coexist with vanilla AeroSpace.'
retire-when = 'Never retire automatically; this defines the Custom product identity.'

[[patch]]
id = 'custom-cli-routing'
commit-subject = 'Route CLI to running AeroSpace Custom'
status = 'custom-only'
upstream-reference = ''
tests = ['AppMetadataTest']
feature-class = 'runtime-target-selection'
feature-rationale = 'Routes CLI commands to the running Custom app while preserving vanilla behavior when it is absent.'
retire-when = 'Retire only if upstream supports equivalent runtime target selection without changing vanilla defaults.'

[[patch]]
id = 'ax-registration-backoff'
commit-subject = 'Throttle failed app registration retries'
status = 'submitted'
upstream-reference = 'https://github.com/nikitabobko/AeroSpace/discussions/2084'
tests = ['FailedRegistrationBackoffTest']
regressions = ['ASR-0008']
retire-when = 'Upstream prevents tight failed AX registration retries and the CPU regression test passes.'

[[patch]]
id = 'avoid-redundant-frame-writes'
commit-subject = 'Avoid redundant accessibility frame writes'
status = 'custom-only'
upstream-reference = ''
tests = ['AxFrameUpdateDecisionTest']
regressions = ['ASR-0009']
retire-when = 'Upstream avoids equivalent no-op AX size and position writes and the retained regression test passes.'

[[patch]]
id = 'delayed-focus-follows-mouse'
commit-subject = 'Stabilize delayed focus follows mouse'
status = 'custom-only'
upstream-reference = ''
tests = ['ConfigTest']
regressions = ['ASR-0010']
retire-when = 'Upstream provides the same delayed overlapping-window behavior and retained tests pass.'

[[patch]]
id = 'monitor-layout-memory'
commit-subject = 'Add native monitor-aware layout memory'
status = 'custom-only'
upstream-reference = ''
tests = ['LayoutMemory']
regressions = ['ASR-0011']
retire-when = 'Retire only if upstream supplies equivalent versioned monitor-profile snapshots, conservative matching, transactional restore, and manual controls.'

[[patch]]
id = 'restore-focus-after-transient-dialog'
commit-subject = 'Restore focus after transient dialogs close'
status = 'custom-only'
upstream-reference = ''
tests = ['FocusAfterWindowRemovalTest']
regressions = ['ASR-0006']
retire-when = 'Upstream restores the exact previous live workspace window after a focused transient dialog closes.'

[[patch]]
id = 'container-mru-focus'
commit-subject = 'Add container-local MRU focus cycling'
status = 'custom-only'
upstream-reference = ''
tests = ['FocusCommandTest']
regressions = ['ASR-0002']
retire-when = 'Upstream provides equivalent container-local MRU cycling and all retained tests pass.'

[[patch]]
id = 'accordion-cardinal-focus'
commit-subject = 'Respect accordion boundaries during cardinal focus'
status = 'submitted'
upstream-reference = 'https://github.com/nikitabobko/AeroSpace/discussions/2236'
tests = ['FocusCommandTest']
regressions = ['ASR-0003']
retire-when = 'Upstream respects accordion overlap boundaries during cardinal focus and all retained tests pass.'

[[patch]]
id = 'native-focus-visible-workspaces'
commit-subject = 'Stabilize native focus across visible workspaces'
status = 'custom-only'
upstream-reference = ''
tests = ['AccessibilityAttributeTest', 'NativeFocusRetryTest', 'NativeFocusZOrderTest']
regressions = ['ASR-0004', 'ASR-0005']
retire-when = 'Upstream focuses one native window without raising same-app windows on other visible workspaces and retained tests pass.'

[[patch]]
id = 'bounded-ax-title-reads'
commit-subject = 'Bound accessibility window title reads'
status = 'custom-only'
upstream-reference = 'https://github.com/nikitabobko/AeroSpace/issues/1257'
tests = ['AsyncTimeoutTest']
regressions = ['ASR-0007']
retire-when = 'Upstream bounds AX title reads without blocking the server and all retained tests pass.'

[[patch]]
id = 'native-focus-retry-task-lint'
commit-subject = 'Use unstructured task for native focus retry'
status = 'custom-only'
upstream-reference = ''
tests = ['NativeFocusRetryTest']
regressions = ['ASR-0004', 'ASR-0005']
retire-when = 'Retire together with native-focus-visible-workspaces when the native focus retry is no longer needed.'

[[patch]]
id = 'native-focus-front-window-preservation'
commit-subject = 'Preserve visible workspace front windows'
status = 'custom-only'
upstream-reference = ''
tests = ['NativeFocusZOrderTest']
regressions = ['ASR-0004']
retire-when = 'Retire with native-focus-visible-workspaces when target-app activation no longer disturbs other visible workspaces.'

[[patch]]
id = 'container-mru-focus-timeout'
commit-subject = 'Extend container MRU focus cycle timeout'
status = 'custom-only'
upstream-reference = ''
tests = ['FocusCommandTest']
regressions = ['ASR-0002']
retire-when = 'Retire with container-mru-focus when the custom MRU cycle is no longer needed.'
